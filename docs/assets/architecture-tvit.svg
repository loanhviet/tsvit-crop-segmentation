<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="TViT architecture">
  <defs>
    <style>
      .bg{fill:#f9fbf7}.txt{font-family:Arial, sans-serif;fill:#172016}.h{font-size:22px;font-weight:700}.s{font-size:15px}.box{rx:12;stroke-width:2}.arrow{stroke:#263b25;stroke-width:3;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#263b25"/></marker>
  </defs>
  <rect width="960" height="430" class="bg"/>
  <text x="480" y="42" text-anchor="middle" class="txt h">TViT ablation: temporal-only reasoning</text>
  <g transform="translate(60 120)">
    <rect width="180" height="170" fill="#d9eef7" stroke="#2f77a3" class="box"/>
    <text x="90" y="42" text-anchor="middle" class="txt h">Patch series</text>
    <text x="90" y="75" text-anchor="middle" class="txt s">each spatial patch</text>
    <text x="90" y="105" text-anchor="middle" class="txt s">has its own timeline</text>
  </g>
  <g transform="translate(315 100)">
    <rect width="230" height="210" fill="#fee2d5" stroke="#d46b35" class="box"/>
    <text x="115" y="48" text-anchor="middle" class="txt h">Temporal Encoder</text>
    <text x="115" y="82" text-anchor="middle" class="txt s">learns seasonal changes</text>
    <text x="115" y="115" text-anchor="middle" class="txt s">per patch independently</text>
    <line x1="55" y1="150" x2="175" y2="150" stroke="#d46b35" stroke-width="3"/>
    <circle cx="55" cy="150" r="7" fill="#ef6f6c"/><circle cx="95" cy="150" r="7" fill="#f3c44f"/><circle cx="135" cy="150" r="7" fill="#6fbf73"/><circle cx="175" cy="150" r="7" fill="#4f86c6"/>
  </g>
  <g transform="translate(620 120)">
    <rect width="280" height="170" fill="#e9e1f3" stroke="#7a5fa6" class="box"/>
    <text x="140" y="42" text-anchor="middle" class="txt h">Segmentation Head</text>
    <text x="140" y="76" text-anchor="middle" class="txt s">reassemble pixel logits</text>
    <text x="140" y="112" text-anchor="middle" class="txt s">no spatial transformer</text>
    <line x1="45" y1="136" x2="235" y2="136" stroke="#b85450" stroke-width="4" stroke-dasharray="10 7"/>
  </g>
  <path d="M240 205 H315" class="arrow"/>
  <path d="M545 205 H620" class="arrow"/>
  <text x="480" y="365" text-anchor="middle" class="txt s">Ablation question: is temporal information alone enough for pixel-level crop segmentation?</text>
</svg>
