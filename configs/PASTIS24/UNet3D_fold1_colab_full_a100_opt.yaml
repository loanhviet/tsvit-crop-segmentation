MODEL:
  architecture: "UNET3D"
  shape_pattern: "NTHWC"
  img_res: 24
  max_seq_len: 60
  num_channels: 11
  num_classes: 19
  dropout: 0.0

DATASETS:
  train:
    dataset: "PASTIS24_fold1"
    label_map:
    max_seq_len: 60
    batch_size: 32
    extra_data:
    num_workers: 8
  eval:
    dataset: "PASTIS24_fold1"
    label_map:
    max_seq_len: 60
    batch_size: 48
    extra_data:
    num_workers: 8
  test:
    dataset: "PASTIS24_fold1"
    label_map:
    max_seq_len: 60
    batch_size: 48
    extra_data:
    num_workers: 8

SOLVER:
  num_epochs: 100
  loss_function: masked_cross_entropy
  class_weights:
  lr_scheduler:
  lr_base: 1e-4
  lr_decay: 0.975
  reset_lr: true

CHECKPOINT:
  load_from_checkpoint:
  partial_restore: false
  save_path: "/content/drive/MyDrive/TSViT_BTL/checkpoints/UNet3D_fold1_full_a100_opt"
  train_metrics_steps: 100
  eval_steps: 2000
  save_steps: 2000
